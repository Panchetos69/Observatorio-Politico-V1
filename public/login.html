<script>
// ══════════════════════════════════════════════════════════════
// USUARIOS — editar aquí para agregar/quitar accesos
// ══════════════════════════════════════════════════════════════
const KOM_USERS = [
  { email: "admin@kom.cl",           password: "kom2025",      name: "Administrador",  role: "admin" },
  { email: "analista@kom.cl",        password: "analista123",  name: "Analista KOM",   role: "user"  },
  { email: "consultor@empresa.cl",   password: "empresa2025",  name: "Consultor",      role: "user"  }
  // Agregar más usuarios aquí con el mismo formato
];
// ══════════════════════════════════════════════════════════════

// Normaliza texto para búsqueda tolerante a tildes/mayúsculas
function normalize(s){ 
  return (s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,''); 
}

function tryLogin() {
  const email    = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPass').value;
  const errEl    = document.getElementById('loginErr');
  
  const user = KOM_USERS.find(u => 
    normalize(u.email) === normalize(email) && u.password === password
  );
  
  if (user) {
    // Guardar sesión en sessionStorage
    sessionStorage.setItem('kom_user', JSON.stringify({
      email: user.email, name: user.name, role: user.role,
      loginAt: new Date().toISOString()
    }));
    // Marcar que debe entrar al dashboard al llegar al index
    sessionStorage.setItem('kom_after_login', '1');
    errEl.textContent = '';
    // Siempre ir al index (landing), que luego auto-redirige al dashboard
    window.location.href = '/';
  } else {
    errEl.textContent = 'Correo o contraseña incorrectos.';
    document.getElementById('loginPass').value = '';
    document.getElementById('loginPass').focus();
  }
}

// Enter key support
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('loginPass').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryLogin();
  });
  document.getElementById('loginEmail').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('loginPass').focus();
  });
  
  // Si ya está logueado, redirigir
  if (sessionStorage.getItem('kom_user')) {
    const redirect = new URLSearchParams(location.search).get('redirect') || '/';
    window.location.href = redirect;
  }
});
</script>

<div class="flex items-center justify-center min-h-[calc(100vh-64px)] px-4">
  <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 w-full max-w-md">
    
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-900 mb-1">Bienvenido</h1>
      <p class="text-gray-500 text-sm">Ingresa tus credenciales para acceder</p>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-600 text-gray-700 mb-1">Correo corporativo</label>
        <input id="loginEmail" type="email" placeholder="tu@empresa.cl"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-400 focus:outline-none text-sm transition"

        <label class="block text-sm font-600 text-gray-700 mb-1">Contraseña</label>

      <p id="loginErr" class="text-red-500 text-sm min-h-[20px]"></p>
