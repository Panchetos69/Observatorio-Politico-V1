<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OP - Congresistas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
    body { font-family:'Inter',sans-serif; }

    .gradient-text {
      background:linear-gradient(135deg,#667eea,#764ba2);
      background-clip:text; -webkit-background-clip:text;
      color:transparent; -webkit-text-fill-color:transparent;
    }
    .gradient-bg { background:linear-gradient(135deg,#667eea,#764ba2); }
    .card-hover  { transition:all .2s; }
    .card-hover:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(102,126,234,.13); }

    /* ── Toggles cámara ── */
    .cam-btn {
      padding:5px 16px; border-radius:999px; font-size:.78rem; font-weight:700;
      border:2px solid transparent; transition:all .18s; cursor:pointer;
    }
    .cam-all      { background:#1f2937; color:#fff; border-color:#1f2937; }
    .cam-diputado { background:#7c3aed; color:#fff; border-color:#7c3aed; }
    .cam-senado   { background:#b91c1c; color:#fff; border-color:#b91c1c; }
    .cam-off      { background:#f3f4f6; color:#6b7280; border-color:#e5e7eb; }
    .cam-off:hover { border-color:#9ca3af; background:#fff; }

    /* ── Avatar ── */
    .av-dip { background:linear-gradient(135deg,#7c3aed,#a855f7); }
    .av-sen { background:linear-gradient(135deg,#b91c1c,#ef4444); }

    /* ── Selector comisión ── */
    .com-select-wrap { position:relative; }
    .com-select-wrap::after {
      content:'▾'; position:absolute; right:12px; top:50%;
      transform:translateY(-50%); color:#9ca3af;
      pointer-events:none; font-size:.75rem;
    }
    #comisionSelect {
      appearance:none; -webkit-appearance:none;
      width:100%; padding:9px 32px 9px 12px;
      border-radius:14px; border:1.5px solid #e5e7eb;
      font-size:.8rem; font-weight:600; color:#374151;
      background:#fff; cursor:pointer; transition:border-color .15s;
      outline:none;
    }
    #comisionSelect:focus  { border-color:#7c3aed; }
    #comisionSelect.active { border-color:#7c3aed; background:#faf5ff; color:#5b21b6; }

    /* ── Chip filtro activo ── */
    .filter-chip {
      display:inline-flex; align-items:center; gap:.35rem;
      padding:3px 10px 3px 12px; border-radius:999px; font-size:.7rem; font-weight:700;
      background:#ede9fe; color:#5b21b6; border:1px solid #c4b5fd;
    }
    .chip-x { cursor:pointer; opacity:.55; transition:opacity .15s; font-size:.85rem; line-height:1; }
    .chip-x:hover { opacity:1; color:#7c3aed; }

    /* ── Badge período ── */
    .periodo-badge {
      display:inline-flex; align-items:center; gap:.25rem;
      padding:2px 8px; border-radius:999px; font-size:.65rem; font-weight:700;
      background:#f0fdf4; color:#166534; border:1px solid #bbf7d0;
    }
    .periodo-badge.reciente { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }

    /* ── Skeleton ── */
    @keyframes shimmer { 0%{background-position:200%}100%{background-position:-200%} }
    .skel {
      border-radius:6px; height:12px;
      background:linear-gradient(90deg,#f0f0f0 25%,#e4e4e4 50%,#f0f0f0 75%);
      background-size:200% 100%; animation:shimmer 1.4s infinite;
    }

    /* ── Modal ── */
    .modal-bg { background:rgba(0,0,0,.45); backdrop-filter:blur(5px); }

    /* ── Toast ── */
    #toast {
      position:fixed; bottom:1.5rem; right:1.5rem; z-index:9999;
      padding:.65rem 1.1rem; border-radius:12px; font-size:.82rem; font-weight:600;
      box-shadow:0 8px 32px rgba(0,0,0,.12); transform:translateY(60px); opacity:0;
      transition:all .25s; pointer-events:none;
    }
    #toast.show { transform:none; opacity:1; }
    #toast.ok  { background:#ecfdf5; color:#065f46; border:1px solid #6ee7b7; }
    #toast.err { background:#fef2f2; color:#991b1b; border:1px solid #fca5a5; }

    /* ── Com row en modal ── */
    .com-row {
      display:flex; align-items:center; gap:.5rem;
      padding:.35rem .6rem; border-radius:8px;
      border:1px solid #f3f4f6; transition:background .12s;
    }
    .com-row:hover { background:#faf5ff; border-color:#ddd6fe; }
    .com-row.highlighted { background:#f5f3ff; border-color:#c4b5fd; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<div id="toast"></div>

<button id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})"
  class="fixed bottom-5 left-5 z-50 w-10 h-10 rounded-full gradient-bg text-white shadow-lg text-base font-bold hidden hover:scale-110 transition">↑</button>

<div class="max-w-7xl mx-auto px-4 py-6">

  <!-- Header -->
  <div class="flex items-center gap-3 mb-1">
    <div class="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center text-white font-extrabold text-sm">OP</div>
    <div>
      <div class="text-xl font-extrabold gradient-text">Observatorio Político</div>
      <div class="text-sm text-gray-400">Parlamentarios</div>
    </div>
  </div>

  <!-- Nav -->
  <div class="mt-4 flex gap-5 text-sm text-gray-500 border-b border-gray-200 pb-3 overflow-x-auto whitespace-nowrap">
    <a href="/chat.html" class="hover:text-gray-800 transition">💬 Chat IA</a>
    <a href="/congresistas.html" class="font-bold text-purple-700">👥 Congresistas</a>
    <a href="/comisiones.html"   class="hover:text-gray-800 transition">📁 Comisiones</a>
    <a href="/actividad.html"    class="hover:text-gray-800 transition">🔔 Actividad</a>
    <a href="/carga.html"        class="hover:text-gray-800 transition">📚 Carga</a>
    <a href="/noticias.html"     class="hover:text-gray-800 transition">📰 Noticias</a>
  </div>

  <!-- Panel filtros -->
  <div class="mt-5 bg-white rounded-2xl border border-gray-100 shadow-sm p-5">

    <div class="flex items-center justify-between gap-3 mb-4 flex-wrap">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-purple-100 flex items-center justify-center text-lg">👥</div>
        <div>
          <h2 class="text-lg font-extrabold text-gray-900">Búsqueda de Congresistas</h2>
          <p class="text-xs text-gray-400">Diputados y Senadores · filtros por comisión y período legislativo</p>
        </div>
      </div>
      <div id="count" class="text-sm font-semibold text-gray-500 shrink-0 bg-gray-50 px-3 py-1.5 rounded-xl border border-gray-100">
        Cargando…
      </div>
    </div>

    <!-- Toggles cámara -->
    <div class="flex items-center gap-2 flex-wrap mb-4">
      <span class="text-xs font-bold text-gray-400 uppercase tracking-wide mr-1">Cámara:</span>
      <button id="btn-all"       class="cam-btn cam-all"  onclick="setCamara('all')">🏛️ Todos</button>
      <button id="btn-diputados" class="cam-btn cam-off"  onclick="setCamara('camara')">🟣 Diputados</button>
      <button id="btn-senado"    class="cam-btn cam-off"  onclick="setCamara('senado')">🔴 Senadores</button>
    </div>

    <!-- Fila: nombre + comisión + período + orden -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">

      <!-- Nombre (debounce) -->
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-300 text-sm select-none">🔍</span>
        <input id="q" type="text"
          class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:border-purple-400 focus:outline-none transition"
          placeholder="Buscar por nombre…"
          oninput="debounceFilter()" />
      </div>

      <!-- Selector comisión -->
      <div class="com-select-wrap">
        <select id="comisionSelect" onchange="applyFilters()" title="Filtrar por comisión">
          <option value="">📋 Todas las comisiones</option>
        </select>
      </div>

      <!-- Selector período -->
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-300 text-sm select-none">📅</span>
        <select id="periodoSelect"
          class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:border-purple-400 focus:outline-none transition appearance-none"
          onchange="applyFilters()">
          <option value="">Todos los períodos</option>
          <!-- Se puebla dinámicamente -->
        </select>
      </div>

      <!-- Orden -->
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-300 text-sm select-none">↕</span>
        <select id="ordenSelect"
          class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:border-purple-400 focus:outline-none transition appearance-none"
          onchange="applyFilters()">
          <option value="recientes">Más recientes primero</option>
          <option value="az">Nombre A → Z</option>
          <option value="za">Nombre Z → A</option>
          <option value="coms_desc">Más comisiones primero</option>
          <option value="coms_asc">Menos comisiones primero</option>
          <option value="diputados">Diputados primero</option>
          <option value="senadores">Senadores primero</option>
        </select>
      </div>
    </div>

    <!-- Chips de filtros activos -->
    <div id="activeFilters" class="mt-2.5 flex flex-wrap gap-2 hidden"></div>

    <!-- Info período activo -->
    <div id="periodoInfo" class="hidden mt-3 p-3 rounded-xl bg-blue-50 border border-blue-100 text-xs text-blue-700 font-semibold"></div>

  </div>

  <!-- Grid resultados -->
  <div id="grid" class="mt-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

</div>

<!-- ════════════════════════════════════
     MODAL KOM
════════════════════════════════════ -->
<div id="komModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-bg p-4">
  <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[92vh] flex flex-col shadow-2xl">

    <div class="flex items-start gap-4 p-5 border-b border-gray-100 shrink-0">
      <div id="komAvatar"
        class="w-14 h-14 shrink-0 rounded-2xl flex items-center justify-center text-white font-extrabold text-lg shadow-sm">
      </div>
      <div class="flex-1 min-w-0">
        <div id="komName"  class="font-extrabold text-gray-900 text-base leading-tight"></div>
        <div id="komMeta"  class="text-xs text-gray-400 mt-0.5"></div>
        <div id="komBadge" class="mt-1.5 flex flex-wrap gap-1"></div>
      </div>
      <button onclick="closeKom()"
        class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 font-bold text-sm flex items-center justify-center shrink-0 transition">×</button>
    </div>

    <div class="flex-1 overflow-y-auto p-5 space-y-4">
      <div id="komComisiones"></div>
      <div>
        <label class="text-xs font-bold text-gray-600 block mb-1.5">📝 Notas internas</label>
        <textarea id="komNotas" rows="4"
          class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-xl resize-none focus:border-purple-400 focus:outline-none transition"
          placeholder="Estrategia, reuniones, observaciones…"></textarea>
      </div>
      <div id="komLink"></div>
    </div>

    <div class="flex gap-2 p-4 border-t border-gray-100 shrink-0">
      <button onclick="closeKom()"
        class="flex-1 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-sm font-semibold text-gray-700 transition">
        Cancelar
      </button>
      <button id="komSaveBtn" onclick="saveKom()"
        class="flex-1 py-2.5 rounded-xl gradient-bg text-white text-sm font-bold hover:opacity-90 transition">
        💾 Guardar perfil
      </button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════
const $ = id => document.getElementById(id);
let camaraActual  = "all";
let allPols       = [];   // todos cargados desde API
let currentPerson = null;
let _deb;

// Año actual para detectar "recientes"
const ANO_ACTUAL = new Date().getFullYear();
// Un congresista es "reciente" si su max_year >= año actual - 1
const ES_RECIENTE_DESDE = ANO_ACTUAL - 1;

// ── Toast ──────────────────────────────────
let _tt;
function toast(msg, type="ok") {
  const t = $("toast");
  t.textContent = (type==="ok"?"✓ ":"✗ ") + msg;
  t.className = `show ${type}`;
  clearTimeout(_tt);
  _tt = setTimeout(()=>t.classList.remove("show"), 3000);
}

// ── Scroll top ─────────────────────────────
window.addEventListener("scroll", ()=>{
  $("scrollTop").classList.toggle("hidden", scrollY < 300);
}, {passive:true});

// ── Helpers API ────────────────────────────
async function apiGet(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function apiPost(url, body) {
  const r = await fetch(url, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function esc(s) {
  return String(s||"")
    .replace(/&/g,"&amp;").replace(/"/g,"&quot;")
    .replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ═══════════════════════════════════════════
// CÁMARA
// ═══════════════════════════════════════════
function setCamara(c) {
  camaraActual = c;
  const map = { all:"cam-all", camara:"cam-diputado", senado:"cam-senado" };
  ["all","camara","senado"].forEach(k => {
    const btn = k==="all" ? $("btn-all") : k==="camara" ? $("btn-diputados") : $("btn-senado");
    btn.className = "cam-btn " + (k===c ? map[k] : "cam-off");
  });
  $("comisionSelect").value = "";
  $("periodoSelect").value  = "";
  loadPeople();
}

// ═══════════════════════════════════════════
// CARGA DESDE API
// ═══════════════════════════════════════════
async function loadPeople() {
  $("count").textContent = "Cargando…";
  $("grid").innerHTML    = skelGrid(6);

  try {
    const data = await apiGet(`/api/politicians?q=&camara=${camaraActual}`);
    allPols = data.politicians || [];

    // Normalizar max_year si no viene del API
    allPols.forEach(p => {
      if (!p.max_year) {
        // Intentar extraer del campo periodo (e.g. "2022-2026" → 2026)
        const m = (p.periodo || "").match(/(\d{4})/g);
        if (m) p.max_year = Math.max(...m.map(Number));
        else   p.max_year = 0;
      }
    });

    buildComisionSelect(allPols);
    buildPeriodoSelect(allPols);
    applyFilters();
  } catch(e) {
    $("count").textContent = "Error";
    $("grid").innerHTML = `<div class="col-span-3 text-red-500 text-sm py-8 text-center">Error: ${esc(e.message)}</div>`;
  }
}

// ═══════════════════════════════════════════
// SELECTOR COMISIONES (agrupado por cámara)
// ═══════════════════════════════════════════
function buildComisionSelect(pols) {
  const dipMap = new Map();
  const senMap = new Map();

  pols.forEach(p => {
    (p.comisiones||[]).forEach(c => {
      if (!c.commission_name) return;
      if (p.chamber === "camara") dipMap.set(c.commission_name, true);
      if (p.chamber === "senado") senMap.set(c.commission_name, true);
    });
  });

  const dipList = [...dipMap.keys()].sort((a,b)=>a.localeCompare(b,"es"));
  const senList = [...senMap.keys()].sort((a,b)=>a.localeCompare(b,"es"));
  const abbr    = n => n.replace(/^Comisi[oó]n\s+(de\s+|del\s+|de\s+la\s+|de\s+los\s+|de\s+las\s+)?/i,"").trim().slice(0,50);

  const prev = $("comisionSelect").value;
  let html = `<option value="">📋 Todas las comisiones</option>`;

  if (dipList.length) {
    html += `<optgroup label="🟣 Cámara de Diputados (${dipList.length} comisiones)">`;
    dipList.forEach(n => { html += `<option value="${esc(n)}">${esc(abbr(n))}</option>`; });
    html += `</optgroup>`;
  }
  if (senList.length) {
    html += `<optgroup label="🔴 Senado (${senList.length} comisiones)">`;
    senList.forEach(n => { html += `<option value="${esc(n)}">${esc(abbr(n))}</option>`; });
    html += `</optgroup>`;
  }

  $("comisionSelect").innerHTML = html;
  if (prev) $("comisionSelect").value = prev;
}

// ═══════════════════════════════════════════
// SELECTOR PERÍODO (basado en años de actividad)
// ═══════════════════════════════════════════
function buildPeriodoSelect(pols) {
  // Recopilar todos los años únicos presentes en los datos
  const yearsSet = new Set();
  pols.forEach(p => {
    const m = (p.periodo || "").match(/\d{4}/g);
    if (m) m.forEach(y => yearsSet.add(parseInt(y)));
    if (p.max_year) yearsSet.add(p.max_year);
  });

  const years = [...yearsSet].sort((a,b) => b - a); // desc

  const prev = $("periodoSelect").value;
  let html = `<option value="">Todos los períodos</option>`;

  // Opción especial: legislatura actual (más reciente)
  if (years.length) {
    const maxY = years[0];
    html += `<option value="actual">⭐ Legislatura actual (${maxY - 3}–${maxY})</option>`;
  }

  // Opciones por año
  years.forEach(y => {
    const label = y >= ES_RECIENTE_DESDE ? `📅 Activos en ${y} (reciente)` : `📅 Activos en ${y}`;
    html += `<option value="${y}">${label}</option>`;
  });

  $("periodoSelect").innerHTML = html;
  if (prev) $("periodoSelect").value = prev;
}

// ═══════════════════════════════════════════
// FILTROS (en el array local)
// ═══════════════════════════════════════════
function debounceFilter() {
  clearTimeout(_deb);
  _deb = setTimeout(applyFilters, 280);
}

function applyFilters() {
  const q        = ($("q").value||"").trim().toLowerCase();
  const comFil   = ($("comisionSelect").value||"").trim();
  const periodo  = ($("periodoSelect").value||"").trim();
  const orden    = $("ordenSelect").value;

  let list = [...allPols];

  // Filtro nombre
  if (q) list = list.filter(p => p.nombre.toLowerCase().includes(q));

  // Filtro comisión
  if (comFil) {
    list = list.filter(p =>
      (p.comisiones||[]).some(c => c.commission_name === comFil)
    );
  }

  // Filtro período
  if (periodo) {
    if (periodo === "actual") {
      // Máximo año del dataset → legislatura "actual"
      const maxY = Math.max(...allPols.map(p => p.max_year || 0));
      const desde = maxY - 3;
      list = list.filter(p => p.max_year >= desde);
    } else {
      const y = parseInt(periodo);
      list = list.filter(p => {
        // Comprobar si alguna comisión tiene actividad en ese año
        const m = (p.periodo || "").match(/(\d{4})/g);
        if (!m) return false;
        const years = m.map(Number);
        if (years.length === 1) return years[0] === y;
        if (years.length >= 2) return y >= Math.min(...years) && y <= Math.max(...years);
        return false;
      });
    }
  }

  // Ordenar
  list.sort((a,b) => {
    switch(orden) {
      case "recientes":  return -(a.max_year||0) + (b.max_year||0) || a.nombre.localeCompare(b.nombre,"es");
      case "az":         return a.nombre.localeCompare(b.nombre,"es");
      case "za":         return b.nombre.localeCompare(a.nombre,"es");
      case "coms_desc":  return (b.comisiones||[]).length - (a.comisiones||[]).length;
      case "coms_asc":   return (a.comisiones||[]).length - (b.comisiones||[]).length;
      case "diputados": {
        const ad=a.chamber==="camara"?0:1, bd=b.chamber==="camara"?0:1;
        return ad-bd || a.nombre.localeCompare(b.nombre,"es");
      }
      case "senadores": {
        const as=a.chamber==="senado"?0:1, bs=b.chamber==="senado"?0:1;
        return as-bs || a.nombre.localeCompare(b.nombre,"es");
      }
      default: return 0;
    }
  });

  renderChips(comFil, periodo);
  renderPeriodoInfo(periodo);
  renderGrid(list, comFil);
}

function renderChips(comFil, periodo) {
  const wrap = $("activeFilters");
  let html = "";

  if (comFil) {
    const abbr = comFil.replace(/^Comisi[oó]n\s+(de\s+)?/i,"").trim().slice(0,45);
    let camLabel = "";
    const opt = [...$("comisionSelect").options].find(o=>o.value===comFil);
    if (opt) {
      const grp = opt.parentElement?.label || "";
      if (grp.includes("Diputados")) camLabel = "🟣 ";
      if (grp.includes("Senado"))    camLabel = "🔴 ";
    }
    html += `<span class="filter-chip">${camLabel}📋 ${esc(abbr)}<span class="chip-x" onclick="clearComFil()">×</span></span>`;
  }

  if (periodo) {
    const label = periodo === "actual" ? "Legislatura actual" : `Año ${periodo}`;
    html += `<span class="filter-chip" style="background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe">📅 ${esc(label)}<span class="chip-x" onclick="clearPeriodo()">×</span></span>`;
  }

  wrap.innerHTML = html;
  wrap.classList.toggle("hidden", !html);
}

function renderPeriodoInfo(periodo) {
  const el = $("periodoInfo");
  if (!periodo) { el.classList.add("hidden"); return; }
  if (periodo === "actual") {
    const maxY = Math.max(...allPols.map(p => p.max_year || 0));
    el.textContent = `📋 Mostrando congresistas activos en la legislatura ${maxY-3}–${maxY} (los más recientes del dataset).`;
  } else {
    el.textContent = `📋 Mostrando congresistas con actividad registrada en ${periodo}.`;
  }
  el.classList.remove("hidden");
}

function clearComFil() {
  $("comisionSelect").value = "";
  $("comisionSelect").classList.remove("active");
  applyFilters();
}

function clearPeriodo() {
  $("periodoSelect").value = "";
  applyFilters();
}

// ═══════════════════════════════════════════
// RENDER GRID
// ═══════════════════════════════════════════
function renderGrid(pols, comFil) {
  const countEl = $("count");

  if (!pols.length) {
    countEl.textContent = "0 congresistas";
    $("grid").innerHTML = `
      <div class="col-span-3">
        <div class="flex flex-col items-center py-16 text-gray-300">
          <div class="text-5xl mb-3">🔍</div>
          <div class="text-base font-bold text-gray-400 mb-1">Sin resultados</div>
          <div class="text-sm text-gray-400 text-center max-w-xs">
            ${comFil
              ? `Ningún parlamentario figura en <strong class="text-gray-500">${esc(comFil.replace(/^Comisi[oó]n\s+(de\s+)?/i,""))}</strong> con los filtros actuales.`
              : "Prueba con otro nombre, cámara o período."}
          </div>
          <div class="flex gap-2 mt-4 flex-wrap justify-center">
            ${comFil   ? `<button onclick="clearComFil()"  class="px-4 py-2 rounded-xl gradient-bg text-white text-xs font-bold hover:opacity-90 transition">Limpiar comisión</button>` : ""}
            ${$("periodoSelect").value ? `<button onclick="clearPeriodo()" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold hover:opacity-90 transition">Limpiar período</button>` : ""}
          </div>
        </div>
      </div>`;
    return;
  }

  countEl.textContent = `${pols.length} congresista${pols.length!==1?"s":""}`;
  $("comisionSelect").classList.toggle("active", !!comFil);

  const grid = $("grid");
  grid.innerHTML = "";

  pols.forEach(p => {
    const initials  = p.nombre.split(" ").slice(0,2).map(x=>x[0]||"").join("").toUpperCase();
    const isSen     = p.chamber === "senado";
    const isDip     = p.chamber === "camara";
    const avCls     = isSen ? "av-sen" : "av-dip";
    const esReciente = (p.max_year || 0) >= ES_RECIENTE_DESDE;

    const chamberBadge = isSen
      ? `<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700">Senador/a</span>`
      : isDip
      ? `<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-purple-100 text-purple-700">Diputado/a</span>`
      : `<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">${esc(p.chamber)}</span>`;

    // Badge período
    let periodoBadge = "";
    if (p.periodo) {
      const cls = esReciente ? "periodo-badge reciente" : "periodo-badge";
      periodoBadge = `<span class="${cls}">📅 ${esc(p.periodo)}</span>`;
    } else if (p.max_year) {
      const cls = esReciente ? "periodo-badge reciente" : "periodo-badge";
      periodoBadge = `<span class="${cls}">📅 hasta ${p.max_year}</span>`;
    }

    const coms = p.comisiones || [];

    // Comisiones: resaltar la filtrada
    let comsHtml = "";
    if (coms.length) {
      // Si hay filtro de comisión, poner esa primera
      const sorted = comFil
        ? [...coms].sort((a,b) => {
            if (a.commission_name === comFil) return -1;
            if (b.commission_name === comFil) return  1;
            return 0;
          })
        : coms;
      const shown = sorted.slice(0, 3);
      const rest  = coms.length - 3;
      comsHtml = `<div class="flex flex-wrap gap-1 mt-2">
        ${shown.map(c => {
          const short  = c.commission_name.replace(/^Comisi[oó]n\s+(de\s+|del\s+|de\s+la\s+)?/i,"").slice(0,28);
          const isHigh = comFil && c.commission_name === comFil;
          return `<span
            class="inline-block text-xs px-2 py-0.5 rounded-full truncate max-w-[130px] cursor-default
              ${isHigh ? "bg-purple-100 text-purple-700 font-bold ring-1 ring-purple-300" : "bg-gray-100 text-gray-500"}"
            title="${esc(c.commission_name)}">${esc(short)}</span>`;
        }).join("")}
        ${rest > 0 ? `<span class="text-xs text-gray-400 self-center">+${rest}</span>` : ""}
      </div>`;
    }

    // Cargo en la comisión filtrada
    let cargoComHtml = "";
    if (comFil) {
      const m = coms.find(c => c.commission_name === comFil);
      if (m?.cargo_en_comision) {
        cargoComHtml = `<div class="text-xs text-purple-600 font-semibold mt-1.5">📋 ${esc(m.cargo_en_comision)}</div>`;
      }
    }

    const card = document.createElement("div");
    card.className = "card-hover bg-white rounded-2xl border border-gray-100 p-5 flex flex-col justify-between";
    card.innerHTML = `
      <div>
        <div class="flex items-start gap-3">
          <div class="w-12 h-12 shrink-0 rounded-2xl ${avCls} text-white flex items-center justify-center font-extrabold text-sm shadow-sm">
            ${initials}
          </div>
          <div class="min-w-0 flex-1">
            <div class="font-extrabold text-gray-900 leading-tight">${esc(p.nombre)}</div>
            <div class="flex items-center gap-2 mt-1 flex-wrap">
              ${chamberBadge}
              ${periodoBadge}
              ${p.cargo ? `<span class="text-xs text-gray-400">${esc(p.cargo)}</span>` : ""}
            </div>
            ${cargoComHtml}
          </div>
        </div>
        ${comsHtml}
        ${coms.length > 0
          ? `<div class="text-xs text-gray-400 mt-1">${coms.length} comisión${coms.length!==1?"es":""}</div>`
          : ""}
      </div>
      <div class="mt-4 flex gap-2">
        ${p.url_ficha
          ? `<a href="${esc(p.url_ficha)}" target="_blank" rel="noopener"
               class="flex-1 text-center px-3 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold transition">
               Ver Perfil ↗
             </a>`
          : ""}
        <button
          class="flex-1 px-3 py-2 rounded-xl gradient-bg text-white text-xs font-bold hover:opacity-90 transition"
          data-ch="${esc(p.chamber)}"
          data-id="${esc(String(p.id))}"
          data-nb="${encodeURIComponent(p.nombre)}"
          data-ur="${encodeURIComponent(p.url_ficha||"")}"
          data-cm="${encodeURIComponent(JSON.stringify(p.comisiones||[]))}"
          onclick="openFromBtn(this)">
          📋 Perfil KOM
        </button>
      </div>`;
    grid.appendChild(card);
  });
}

function skelGrid(n) {
  return Array.from({length:n}).map(()=>`
    <div class="bg-white rounded-2xl border border-gray-100 p-5 space-y-3">
      <div class="flex gap-3 items-start">
        <div class="skel w-12 shrink-0" style="height:48px;border-radius:12px"></div>
        <div class="flex-1 space-y-2 pt-1">
          <div class="skel w-4/5"></div>
          <div class="skel w-2/5 h-2"></div>
        </div>
      </div>
      <div class="flex gap-1"><div class="skel w-1/3 h-2"></div><div class="skel w-1/4 h-2"></div></div>
      <div class="skel w-full rounded-xl" style="height:30px"></div>
    </div>`).join("");
}

// ═══════════════════════════════════════════
// MODAL KOM
// ═══════════════════════════════════════════
function openFromBtn(btn) {
  const chamber  = btn.dataset.ch;
  const id       = btn.dataset.id;
  const nombre   = decodeURIComponent(btn.dataset.nb||"");
  const urlFicha = decodeURIComponent(btn.dataset.ur||"");
  let coms = [];
  try { coms = JSON.parse(decodeURIComponent(btn.dataset.cm||"[]")); } catch {}
  openKom(chamber, id, nombre, urlFicha, coms);
}

async function openKom(chamber, id, nombre, urlFicha, comisiones) {
  currentPerson = { chamber, id, nombre, url_ficha:urlFicha, comisiones };

  const initials = nombre.split(" ").slice(0,2).map(x=>x[0]||"").join("").toUpperCase();
  const isSen    = chamber === "senado";

  const av = $("komAvatar");
  av.className = `w-14 h-14 shrink-0 rounded-2xl flex items-center justify-center text-white font-extrabold text-lg shadow-sm ${isSen?"av-sen":"av-dip"}`;
  av.textContent = initials;

  $("komName").textContent = nombre;
  $("komMeta").textContent = `${isSen?"Senador/a":"Diputado/a"} · ID ${id}`;

  $("komBadge").innerHTML = isSen
    ? `<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700">🔴 Senado</span>`
    : `<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-purple-100 text-purple-700">🟣 Diputados</span>`;

  const activeCom = $("comisionSelect").value;
  const comDiv    = $("komComisiones");

  if (comisiones.length) {
    const sorted = [...comisiones].sort((a,b) => {
      if (activeCom) {
        if (a.commission_name === activeCom) return -1;
        if (b.commission_name === activeCom) return  1;
      }
      return a.commission_name.localeCompare(b.commission_name,"es");
    });

    comDiv.innerHTML = `
      <div>
        <div class="text-xs font-bold text-gray-500 mb-2 flex items-center gap-2">
          📚 Comisiones
          <span class="text-gray-400 font-normal">(${comisiones.length})</span>
          ${activeCom ? `<span class="text-purple-600 font-semibold">· filtro activo resaltado</span>` : ""}
        </div>
        <div class="space-y-1 max-h-48 overflow-y-auto pr-1">
          ${sorted.map(c => {
            const isH = activeCom && c.commission_name === activeCom;
            return `<div class="com-row ${isH?"highlighted":""}">
              <span class="text-xs text-gray-400 w-20 shrink-0">${esc(c.group||"")}</span>
              <span class="text-xs font-semibold text-gray-700 flex-1 leading-tight">${esc(c.commission_name)}</span>
              ${c.cargo_en_comision
                ? `<span class="text-xs font-medium ${isH?"text-purple-700":"text-gray-500"} shrink-0">${esc(c.cargo_en_comision)}</span>`
                : ""}
              ${c.periodo
                ? `<span class="text-xs text-gray-400 shrink-0 ml-1">📅 ${esc(c.periodo)}</span>`
                : ""}
            </div>`;
          }).join("")}
        </div>
      </div>`;
  } else {
    comDiv.innerHTML = `<div class="text-xs text-gray-400 italic py-1">Sin comisiones registradas</div>`;
  }

  $("komLink").innerHTML = urlFicha
    ? `<a href="${esc(urlFicha)}" target="_blank" rel="noopener"
         class="inline-flex items-center gap-1.5 text-xs text-purple-600 hover:underline font-semibold">
         🔗 Ver perfil oficial ↗
       </a>`
    : "";

  $("komNotas").value = "";
  try {
    const data = await apiGet(`/api/kom/${chamber}/${id}`);
    $("komNotas").value = (data.profile && (data.profile.notas || data.profile.notes)) || "";
  } catch {}

  $("komModal").classList.remove("hidden");
  $("komModal").classList.add("flex");
}

function closeKom() {
  $("komModal").classList.add("hidden");
  $("komModal").classList.remove("flex");
  currentPerson = null;
}

$("komModal").addEventListener("click", e => { if (e.target===$("komModal")) closeKom(); });

async function saveKom() {
  if (!currentPerson) return;
  const btn  = $("komSaveBtn");
  const orig = btn.textContent;
  btn.textContent = "Guardando…"; btn.disabled = true;

  try {
    await apiPost(`/api/kom/${currentPerson.chamber}/${currentPerson.id}`, {
      notas:      $("komNotas").value || "",
      nombre:     currentPerson.nombre,
      url_ficha:  currentPerson.url_ficha,
      comisiones: currentPerson.comisiones,
      updated_at: new Date().toISOString(),
    });
    btn.textContent = "✓ Guardado";
    btn.classList.replace("gradient-bg","bg-green-500");
    toast(`Perfil de ${currentPerson.nombre} guardado`);
    setTimeout(() => {
      btn.textContent = orig;
      btn.classList.replace("bg-green-500","gradient-bg");
      btn.disabled = false;
    }, 2200);
  } catch(e) {
    toast("Error: " + e.message, "err");
    btn.textContent = orig; btn.disabled = false;
  }
}
